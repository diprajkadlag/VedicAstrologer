name: Deploy demo

# Publishes the app to GitHub Pages so it can be used from a browser or a
# phone without cloning anything. The Pages build is a static export: no
# server, so no /api/geocode — the browser calls Nominatim directly. See
# next.config.ts and lib/geocoding/client.ts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build the static export
        # A project page lives under /<repo>/, so the bundle has to be built
        # for that prefix or every asset 404s.
        env:
          STATIC_EXPORT: '1'
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages drops every path beginning with an underscore —
        # which is all of Next's _next/ output.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
